<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나를 소개한다</title>
    <!-- 레트로 8비트 느낌을 살려주는 구글 폰트 (DungGeunMo 웹폰트 및 Press Start 2P) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
    <style>
        /* 둥근모꼴 한글 픽셀 폰트 불러오기 */
        @font-face {
            font-family: 'DungGeunMo';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #12121e;
            --cabinet-bg: #1e1e36;
            --neon-pink: #ff2a85;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --text-color: #ffffff;
            --border-width: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 게임 UI 느낌을 위해 텍스트 드래그 방지 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'DungGeunMo', 'Press Start 2P', monospace;
            line-height: 1.6;
            overflow-x: hidden;
            /* 배경 픽셀 그리드 패턴 */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 15px;
        }

        /* 브라운관(CRT) 스캔라인 효과 */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* 메인 컨테이너 (아케이드 게임기 화면) */
        .arcade-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--cabinet-bg);
            border: var(--border-width) solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.2);
            padding: 20px;
            position: relative;
        }

        /* 상단 상태바 (INSERT COIN, SCORE 등) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px dashed var(--neon-pink);
            padding-bottom: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .blink {
            animation: blinker 1s linear infinite;
            color: var(--neon-yellow);
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .sound-toggle {
            background: #000;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 4px 10px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* 타이틀 영역 */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .pixel-avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 15px;
            background: #2b2b4b;
            border: 4px solid var(--neon-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0px #000;
        }

        h1 {
            font-size: 2rem;
            color: var(--neon-yellow);
            text-shadow: 3px 3px 0px var(--neon-pink), -2px -2px 0px #000;
            margin-bottom: 10px;
            word-break: keep-all;
        }

        .subtitle {
            color: var(--neon-cyan);
            font-size: 1.1rem;
        }

        /* 섹션 공통 스타일 */
        .game-section {
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid #4a4a7a;
            padding: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        .section-title {
            background: var(--neon-pink);
            color: #fff;
            display: inline-block;
            padding: 4px 12px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            box-shadow: 3px 3px 0px #000;
        }

        /* 방문자 환영 인사 영역 */
        .welcome-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 180px;
            background: #000;
            border: 3px solid var(--neon-cyan);
            color: var(--neon-green);
            padding: 10px 14px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #557777;
        }

        .retro-btn {
            background: var(--neon-yellow);
            color: #000;
            border: 3px solid #fff;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s;
        }

        .retro-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #000;
        }

        .welcome-message {
            margin-top: 10px;
            padding: 12px;
            background: #0a0a14;
            border-left: 4px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 1.05rem;
            display: none;
        }

        /* 좋아하는 것 3가지 카드 (플립 애니메이션) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .flip-card {
            background-color: transparent;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 4px solid var(--neon-cyan);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-shadow: 4px 4px 0px #000;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #252547 0%, #16162c 100%);
        }

        .flip-card-front .emoji-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            filter: drop-shadow(3px 3px 0px #000);
        }

        .flip-card-front h3 {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            margin-bottom: 8px;
        }

        .tap-hint {
            font-size: 0.75rem;
            color: #aaa;
            background: #000;
            padding: 2px 6px;
        }

        .flip-card-back {
            background: #1b112c;
            border-color: var(--neon-pink);
            color: #fff;
            transform: rotateY(180deg);
            font-size: 0.95rem;
            word-break: keep-all;
            line-height: 1.5;
        }

        .flip-card-back strong {
            color: var(--neon-yellow);
            display: block;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        /* OX 퀴즈 영역 */
        .quiz-question {
            font-size: 1.25rem;
            text-align: center;
            margin: 15px 0 20px;
            color: #fff;
            background: #000;
            padding: 15px;
            border: 2px dashed var(--neon-yellow);
        }

        .ox-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .ox-btn {
            width: 100px;
            height: 80px;
            font-size: 2.5rem;
            font-family: inherit;
            font-weight: bold;
            border: 4px solid #fff;
            cursor: pointer;
            box-shadow: 5px 5px 0px #000;
            transition: transform 0.1s;
        }

        .ox-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-o {
            background-color: #0088ff;
            color: #fff;
        }

        .btn-x {
            background-color: #ff2a55;
            color: #fff;
        }

        .quiz-result {
            margin-top: 20px;
            text-align: center;
            font-size: 1.15rem;
            padding: 15px;
            display: none;
            word-break: keep-all;
        }

        .quiz-result.correct {
            background: rgba(0, 255, 102, 0.15);
            border: 3px solid var(--neon-green);
            color: var(--neon-green);
        }

        .quiz-result.wrong {
            background: rgba(255, 42, 85, 0.15);
            border: 3px solid var(--neon-pink);
            color: #ff7799;
        }

        /* 퀴즈 애니메이션 (흔들림 효과) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }

        /* 오늘의 운세 영역 */
        .fortune-area {
            text-align: center;
        }

        .fortune-btn {
            background: var(--neon-pink);
            color: #fff;
            font-size: 1.1rem;
            padding: 14px 24px;
            margin-bottom: 15px;
        }

        .fortune-display {
            background: #000;
            border: 3px solid var(--neon-green);
            padding: 20px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--neon-yellow);
            font-size: 1.1rem;
            word-break: keep-all;
        }

        .fortune-grade {
            display: inline-block;
            background: var(--neon-cyan);
            color: #000;
            padding: 2px 10px;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* 축하 폭죽 파티클 캔버스 */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* 하단 푸터 */
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #8888aa;
        }

        /* 모바일 반응형 처리 */
        @media (max-width: 650px) {
            body {
                padding: 8px;
            }
            .arcade-container {
                padding: 14px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .cards-grid {
                grid-template-columns: 1fr; /* 모바일에서는 카드를 세로 1열로 배치 */
            }
            .flip-card {
                height: 170px;
            }
            .flip-card-front .emoji-icon {
                font-size: 2.8rem;
                margin-bottom: 6px;
            }
            .ox-btn {
                width: 85px;
                height: 70px;
                font-size: 2rem;
            }
        }
    </style>
